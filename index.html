<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Todo</h1>
        <div id="user" hidden>
          <span id="user-name"></span>
          <button id="logout" class="link">Đăng xuất</button>
        </div>
      </header>

      <p id="status">Đang tải...</p>

      <section id="login-view" hidden>
        <p>Đăng nhập để xem và đồng bộ danh sách việc của bạn.</p>
        <button id="login" class="primary">Đăng nhập bằng Google</button>
      </section>

      <section id="todo-view" hidden>
        <form id="add-form">
          <input id="new-todo" type="text" placeholder="Thêm việc mới..." autocomplete="off" />
        </form>
        <ul id="todo-list"></ul>
        <p id="empty" hidden>Chưa có việc nào.</p>
        <p id="count"></p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
