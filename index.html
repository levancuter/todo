<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Todo</h1>
        <div id="user" hidden>
          <span id="user-name"></span>
          <button id="logout" class="link">Đăng xuất</button>
        </div>
      </header>

      <p id="status">Đang tải...</p>

      <section id="login-view" hidden>
        <p>Đăng nhập để xem và đồng bộ danh sách việc của bạn.</p>
        <button id="login" class="primary">Đăng nhập bằng Google</button>
      </section>

      <section id="todo-view" hidden>
        <nav id="tabs">
          <button data-tab="work">Công việc</button>
          <button data-tab="life">Cuộc sống</button>
          <button data-tab="all">Tất cả</button>
        </nav>
        <div id="day-nav">
          <button id="prev-day" class="icon" title="Ngày trước">←</button>
          <span id="day-label"></span>
          <button id="next-day" class="icon" title="Ngày sau">→</button>
        </div>
        <form id="add-form">
          <input id="new-todo" type="text" placeholder="Thêm việc mới..." autocomplete="off" />
        </form>
        <p id="hours"></p>
        <ul id="todo-list"></ul>
        <p id="empty" hidden>Chưa có việc nào.</p>
        <p id="count"></p>
      </section>
    </main>

    <aside id="detail" hidden>
      <div class="detail-head">
        <span>Chi tiết</span>
        <button id="detail-close" class="icon" title="Đóng">✕</button>
      </div>
      <div class="detail-title">
        <input id="detail-done" type="checkbox" title="Hoàn thành" />
        <input id="detail-text" type="text" autocomplete="off" />
      </div>
      <label>
        Giờ dự kiến
        <span class="detail-estimate">
          <input id="detail-estimate" type="number" min="0" step="0.5" inputmode="decimal" />
          giờ
        </span>
      </label>
      <label>
        Loại
        <select id="detail-category">
          <option value="work">Công việc</option>
          <option value="life">Cuộc sống</option>
        </select>
      </label>
      <label>
        Lặp lại
        <select id="detail-repeat">
          <option value="none">Không lặp lại</option>
          <option value="daily">Hằng ngày</option>
          <option value="weekdays">Thứ 2 – Thứ 6</option>
          <option value="custom">Chọn thứ</option>
        </select>
      </label>
      <div id="detail-days" hidden>
        <button type="button" data-day="1">T2</button>
        <button type="button" data-day="2">T3</button>
        <button type="button" data-day="3">T4</button>
        <button type="button" data-day="4">T5</button>
        <button type="button" data-day="5">T6</button>
        <button type="button" data-day="6">T7</button>
        <button type="button" data-day="0">CN</button>
      </div>
      <label>
        Ghi chú
        <textarea id="detail-note" rows="10" placeholder="Thêm ghi chú..."></textarea>
      </label>
      <p class="detail-meta">
        <span id="detail-created"></span>
        <span id="detail-status"></span>
      </p>
      <button id="detail-delete" class="danger">Xóa việc</button>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
